name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f app/api/requirements.txt ]; then pip install -r app/api/requirements.txt; fi

      - name: Code Style & Syntax Check (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Pytest Test Suite
        run: |
          python -m pytest app/tests/ -v

      - name: Verify Model Artifact Sanity
        run: |
          python -c "import joblib, pathlib; p = pathlib.Path('models/spotify_skip_predictor_xgb.pkl'); assert p.exists(), 'Model file missing'; payload = joblib.load(p); assert 'model' in payload and len(payload['features']) > 0; print('CI Sanity Check: Model artifact verified successfully!')"

