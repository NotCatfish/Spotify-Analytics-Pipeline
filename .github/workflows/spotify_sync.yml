name: Spotify 24/7 Cloud Listening Sync & Audit

on:
  schedule:
    # Production schedule: Runs at minutes 14 and 47 of every hour (off-peak to avoid GitHub Actions :00 queue delay/drops)
    - cron: '14,47 * * * *'
  workflow_dispatch: # Allows manual on-demand execution with a single click in GitHub Actions UI


permissions:
  contents: write # Needed to commit and push updated shadow_audit.jsonl back to main

concurrency:
  group: spotify-cloud-sync
  cancel-in-progress: false

jobs:
  sync-listening-history:
    name: Sync Spotify Plays & Evaluate Predictions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spotipy requests pandas scikit-learn xgboost python-dotenv joblib

      - name: Run Cloud Listening Sync & Replay Audit
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
        run: |
          python app/pipeline/07_cloud_listening_sync.py --hours 0 --limit 50


      - name: Commit & Push Audit Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/shadow_audit.jsonl
          if git diff --staged --quiet; then
            echo "No new listening history to commit."
          else
            git commit -m "chore(audit): update spotify listening history [skip ci]"
            git push
          fi
