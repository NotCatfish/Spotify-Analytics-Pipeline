name: Daily Model Retraining & Audit Verification

on:
  schedule:
    # Runs at 00:00 UTC every day, and retries at minute 37 of every hour if not yet completed for the day
    - cron: '0,37 * * * *'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining execution regardless of today status flag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: model-daily-retraining
  cancel-in-progress: false

jobs:
  daily-retrain:
    name: Retrain & Verify Model
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn xgboost python-dotenv joblib requests

      - name: Run Daily Model Retrain & Verification
        run: |
          if [ "${{ inputs.force_retrain }}" = "true" ]; then
            python app/pipeline/08_daily_model_retrain.py --force
          else
            python app/pipeline/08_daily_model_retrain.py
          fi

      - name: Commit & Push Retrained Model Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/spotify_skip_predictor_xgb.pkl data/audit/retrain_status.json
          if git diff --staged --quiet; then
            echo "No model updates to commit (model already current for today)."
          else
            git commit -m "chore(mlops): update retrained skip prediction model & status [skip ci]"
            git push
          fi
