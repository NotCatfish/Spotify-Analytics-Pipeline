version: '3.8'

services:
  api:
    build: .
    container_name: spotify_ml_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - spotify_data:/app/data
      - spotify_cache:/app/.spotify_cache
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  monitor:
    build: .
    container_name: spotify_ml_monitor
    command: ["python", "live_monitor.py"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - spotify_data:/app/data
      - spotify_cache:/app/.spotify_cache
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "find /app/data/heartbeat.txt -mmin -2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - api

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  spotify_data:
  spotify_cache:
